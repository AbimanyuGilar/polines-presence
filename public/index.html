<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polines Presensi Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --accent-green: #10b981;
      --text-muted-dark: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 20% 20%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      padding: 1.5rem 1rem;
    }

    .card-custom {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5),
                  0 0 30px 0 var(--accent-glow);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-header-custom {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
      margin-bottom: 1rem;
    }

    .form-control, .input-group-text {
      background-color: rgba(15, 23, 42, 0.6);
      border-color: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }

    .form-control:focus {
      background-color: rgba(15, 23, 42, 0.8);
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-glow);
      color: #ffffff;
    }

    .input-group-text {
      color: var(--text-muted-dark);
    }

    .btn-accent {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 0.8rem 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    .btn-accent:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
      color: #ffffff;
    }

    .btn-success-custom {
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 0.8rem 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }

    .btn-success-custom:hover {
      background: linear-gradient(135deg, #047857, #059669);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
      color: #ffffff;
    }

    .user-profile-badge {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
    }

    .upload-box {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 0.75rem;
      padding: 1.25rem;
      text-align: center;
      transition: border-color 0.2s ease;
      background: rgba(15, 23, 42, 0.3);
    }

    .upload-box:hover {
      border-color: var(--accent-blue);
    }

    .alert {
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
    }

    .result-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
    }

    .result-box ul {
      margin-bottom: 0;
      padding-left: 1.2rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card card-custom mx-auto">
    <div class="card-header-custom">
      <div class="brand-icon">
        <i class="bi bi-qr-code-scan"></i>
      </div>
      <h4 class="mb-1 fw-bold tracking-tight">Presensi Web</h4>
      <p class="mb-0 small text-secondary">Sistem Presensi Otomatis Polines</p>
    </div>
    <div class="card-body p-4">

      <!-- ALERT MESSAGE -->
      <div id="alertBox" class="alert d-none alert-dismissible fade show mb-4" role="alert">
        <span id="alertMessage"></span>
        <button type="button" class="btn-close" onclick="hideAlert()"></button>
      </div>

      <!-- FORM LOGIN -->
      <form id="loginForm" class="d-block">
        <div class="mb-3">
          <label for="nim" class="form-label small fw-medium text-secondary">NIM MAHASISWA</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="nim" placeholder="Contoh: 3.34.24.1.23" required autocomplete="username">
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label small fw-medium text-secondary">PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Masukkan password" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" id="btnLogin" class="btn btn-accent w-100">
          <span id="btnLoginSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
          <i class="bi bi-box-arrow-in-right me-1" id="btnLoginIcon"></i> Masuk Sekarang
        </button>
      </form>

      <!-- FORM UPLOAD QR -->
      <div id="uploadSection" class="d-none">
        <div class="user-profile-badge d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center gap-3">
            <div class="avatar-icon rounded-circle bg-primary bg-opacity-20 text-primary p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
              <i class="bi bi-person-fill fs-5"></i>
            </div>
            <div>
              <span class="d-block fs-7 text-secondary lh-1">Mahasiswa</span>
              <span class="fw-semibold text-white fs-6" id="userNama">-</span>
            </div>
          </div>
          <button id="btnLogout" class="btn btn-sm btn-outline-danger border-0">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </button>
        </div>

        <form id="qrForm">
          <div class="mb-3">
            <label class="form-label small fw-medium text-secondary mb-2">PRESENSI QR CODE</label>
            <div class="upload-box">
              <i class="bi bi-cloud-arrow-up fs-2 text-primary d-block mb-2"></i>
              <input class="form-control form-control-sm mb-2" type="file" id="qrImage" accept="image/*" required>
              <span class="text-secondary small d-block">Pilih screenshot QR Code presensi kelas</span>
            </div>
          </div>

          <div id="previewContainer" class="text-center mb-3 d-none">
            <img id="imagePreview" src="#" alt="Preview QR" class="img-fluid rounded border border-secondary p-1" style="max-height: 180px;">
          </div>

          <button type="submit" id="btnUpload" class="btn btn-success-custom w-100 mt-2">
            <span id="btnUploadSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
            <i class="bi bi-send me-1" id="btnUploadIcon"></i> Proses Presensi
          </button>
        </form>

        <div id="resultContainer" class="mt-4 d-none">
          <label class="form-label small fw-medium text-secondary mb-2">HASIL PROSES</label>
          <div id="resultContent" class="p-3 result-box"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const uploadSection = document.getElementById('uploadSection');
  const alertBox = document.getElementById('alertBox');
  const alertMessage = document.getElementById('alertMessage');

  // Check auth session status on page load
  checkSession();

  function showAlert(msg, type = 'danger') {
    const alertTypes = {
      danger: 'alert-danger text-danger-emphasis',
      success: 'alert-success text-success-emphasis',
      warning: 'alert-warning text-warning-emphasis',
      info: 'alert-info text-info-emphasis'
    };
    alertBox.className = `alert ${alertTypes[type] || 'alert-danger'} alert-dismissible fade show`;
    alertMessage.innerHTML = msg;
    alertBox.classList.remove('d-none');
  }

  function hideAlert() {
    alertBox.classList.add('d-none');
  }

  async function checkSession() {
    try {
      const res = await fetch('/api/user');
      const data = await res.json();
      if (data.loggedIn) {
        showUploadSection(data.user);
      } else {
        showLoginForm();
      }
    } catch (err) {
      showLoginForm();
    }
  }

  function showLoginForm() {
    loginForm.classList.remove('d-none');
    uploadSection.classList.add('d-none');
  }

  function showUploadSection(user) {
    document.getElementById('userNama').innerText = user.nama || user.nim;
    loginForm.classList.add('d-none');
    uploadSection.classList.remove('d-none');
  }

  // Handle Login
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const nim = document.getElementById('nim').value.trim();
    const password = document.getElementById('password').value;

    const btnLogin = document.getElementById('btnLogin');
    const spinner = document.getElementById('btnLoginSpinner');
    const icon = document.getElementById('btnLoginIcon');

    btnLogin.disabled = true;
    spinner.classList.remove('d-none');
    icon.classList.add('d-none');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nim, password })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showAlert('Login berhasil!', 'success');
        showUploadSection(data.user);
      } else {
        showAlert(data.message || 'Login gagal');
      }
    } catch (err) {
      showAlert('Terjadi kesalahan koneksi server');
    } finally {
      btnLogin.disabled = false;
      spinner.classList.add('d-none');
      icon.classList.remove('d-none');
    }
  });

  // Handle Logout
  document.getElementById('btnLogout').addEventListener('click', async () => {
    try {
      await fetch('/api/logout', { method: 'POST' });
    } catch (err) {}
    showLoginForm();
    showAlert('Anda telah logout', 'info');
  });

  // Image preview
  const qrInput = document.getElementById('qrImage');
  const previewContainer = document.getElementById('previewContainer');
  const imagePreview = document.getElementById('imagePreview');

  qrInput.addEventListener('change', function () {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        imagePreview.src = e.target.result;
        previewContainer.classList.remove('d-none');
      }
      reader.readAsDataURL(file);
    } else {
      previewContainer.classList.add('d-none');
    }
  });

  // Handle Submit QR
  document.getElementById('qrForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const file = qrInput.files[0];
    if (!file) {
      showAlert('Silakan pilih gambar QR Code terlebih dahulu.');
      return;
    }

    const formData = new FormData();
    formData.append('qrImage', file);

    const btnUpload = document.getElementById('btnUpload');
    const spinner = document.getElementById('btnUploadSpinner');
    const icon = document.getElementById('btnUploadIcon');
    const resultContainer = document.getElementById('resultContainer');
    const resultContent = document.getElementById('resultContent');

    btnUpload.disabled = true;
    spinner.classList.remove('d-none');
    icon.classList.add('d-none');
    resultContainer.classList.add('d-none');

    try {
      const res = await fetch('/api/presensi', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      resultContainer.classList.remove('d-none');

      if (data.status === 'hadir') {
        showAlert(data.message, 'success');
        let matkulHtml = '';
        if (data.results && data.results.length) {
          matkulHtml = '<ul class="mt-2 text-secondary">' + data.results.map(r => `<li><b class="text-white">${r.matkul}</b>: ${r.status}</li>`).join('') + '</ul>';
        }
        resultContent.innerHTML = `<div class="text-success fw-semibold"><i class="bi bi-check-circle-fill me-1"></i> ${data.message}</div>${matkulHtml}`;
      } else if (data.status === 'sudah_presensi') {
        showAlert(data.message, 'warning');
        resultContent.innerHTML = `<div class="text-warning fw-semibold"><i class="bi bi-exclamation-triangle-fill me-1"></i> ${data.message}</div>`;
      } else if (data.status === 'tidak_eligible') {
        showAlert(data.message, 'info');
        resultContent.innerHTML = `<div class="text-info fw-semibold"><i class="bi bi-info-circle-fill me-1"></i> ${data.message}</div>`;
      } else {
        showAlert(data.message || 'Presensi gagal', 'danger');
        resultContent.innerHTML = `<div class="text-danger fw-semibold"><i class="bi bi-x-circle-fill me-1"></i> ${data.message}</div>`;
      }
    } catch (err) {
      showAlert('Terjadi kesalahan saat memproses gambar QR');
    } finally {
      btnUpload.disabled = false;
      spinner.classList.add('d-none');
      icon.classList.remove('d-none');
    }
  });
</script>

</body>
</html>
