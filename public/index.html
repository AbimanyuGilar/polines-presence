<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polines Presensi Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-custom {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
    }
    .card-header-custom {
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      color: white;
      border-top-left-radius: 1rem !important;
      border-top-right-radius: 1rem !important;
      padding: 1.5rem;
      text-align: center;
    }
    .btn-primary {
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 0.5rem;
    }
    .form-control {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>

<div class="container p-3">
  <div class="card card-custom mx-auto">
    <div class="card-header-custom">
      <h4 class="mb-1 fw-bold"><i class="bi bi-qr-code-scan me-2"></i>Presensi Web</h4>
      <p class="mb-0 small text-white-50">Sistem Presensi Otomatis Polines</p>
    </div>
    <div class="card-body p-4">

      <!-- ALERT MESSAGE -->
      <div id="alertBox" class="alert d-none alert-dismissible fade show" role="alert">
        <span id="alertMessage"></span>
        <button type="button" class="btn-close" onclick="hideAlert()"></button>
      </div>

      <!-- FORM LOGIN -->
      <form id="loginForm" class="d-block">
        <h5 class="fw-bold mb-3">Login Mahasiswa</h5>
        <div class="mb-3">
          <label for="nim" class="form-label">NIM</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="nim" placeholder="Contoh: 3.34.24.1.23" required>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
          </div>
        </div>
        <button type="submit" id="btnLogin" class="btn btn-primary w-100">
          <span id="btnLoginSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
          <i class="bi bi-box-arrow-in-right me-1" id="btnLoginIcon"></i> Login
        </button>
      </form>

      <!-- FORM UPLOAD QR -->
      <div id="uploadSection" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h6 class="mb-0 text-muted">Selamat Datang,</h6>
            <h5 class="fw-bold mb-0 text-primary" id="userNama">-</h5>
          </div>
          <button id="btnLogout" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </div>
        <hr class="my-3">

        <form id="qrForm">
          <div class="mb-4">
            <label for="qrImage" class="form-label fw-bold">Upload Gambar QR Code Presensi</label>
            <input class="form-control" type="file" id="qrImage" accept="image/*" required>
            <div class="form-text mt-2">
              <i class="bi bi-info-circle me-1"></i> Upload screenshot QR Code presensi yang ada di kelas.
            </div>
          </div>

          <div id="previewContainer" class="text-center mb-3 d-none">
            <img id="imagePreview" src="#" alt="Preview QR" class="img-fluid rounded border p-1" style="max-height: 200px;">
          </div>

          <button type="submit" id="btnUpload" class="btn btn-success w-100 py-2">
            <span id="btnUploadSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
            <i class="bi bi-send me-1" id="btnUploadIcon"></i> Process Presensi
          </button>
        </form>

        <div id="resultContainer" class="mt-4 d-none">
          <h6 class="fw-bold mb-2">Hasil Presensi:</h6>
          <div id="resultContent" class="p-3 bg-light rounded border"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const uploadSection = document.getElementById('uploadSection');
  const alertBox = document.getElementById('alertBox');
  const alertMessage = document.getElementById('alertMessage');

  // Check auth session status on page load
  checkSession();

  function showAlert(msg, type = 'danger') {
    alertBox.className = `alert alert-${type} alert-dismissible fade show`;
    alertMessage.innerHTML = msg;
    alertBox.classList.remove('d-none');
  }

  function hideAlert() {
    alertBox.classList.add('d-none');
  }

  async function checkSession() {
    try {
      const res = await fetch('/api/user');
      const data = await res.json();
      if (data.loggedIn) {
        showUploadSection(data.user);
      } else {
        showLoginForm();
      }
    } catch (err) {
      showLoginForm();
    }
  }

  function showLoginForm() {
    loginForm.classList.remove('d-none');
    uploadSection.classList.add('d-none');
  }

  function showUploadSection(user) {
    document.getElementById('userNama').innerText = user.nama || user.nim;
    loginForm.classList.add('d-none');
    uploadSection.classList.remove('d-none');
  }

  // Handle Login
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const nim = document.getElementById('nim').value.trim();
    const password = document.getElementById('password').value;

    const btnLogin = document.getElementById('btnLogin');
    const spinner = document.getElementById('btnLoginSpinner');
    const icon = document.getElementById('btnLoginIcon');

    btnLogin.disabled = true;
    spinner.classList.remove('d-none');
    icon.classList.add('d-none');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nim, password })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showAlert('Login berhasil!', 'success');
        showUploadSection(data.user);
      } else {
        showAlert(data.message || 'Login gagal');
      }
    } catch (err) {
      showAlert('Terjadi kesalahan koneksi server');
    } finally {
      btnLogin.disabled = false;
      spinner.classList.add('d-none');
      icon.classList.remove('d-none');
    }
  });

  // Handle Logout
  document.getElementById('btnLogout').addEventListener('click', async () => {
    try {
      await fetch('/api/logout', { method: 'POST' });
    } catch (err) {}
    showLoginForm();
    showAlert('Anda telah logout', 'info');
  });

  // Image preview
  const qrInput = document.getElementById('qrImage');
  const previewContainer = document.getElementById('previewContainer');
  const imagePreview = document.getElementById('imagePreview');

  qrInput.addEventListener('change', function () {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        imagePreview.src = e.target.result;
        previewContainer.classList.remove('d-none');
      }
      reader.readAsDataURL(file);
    } else {
      previewContainer.classList.add('d-none');
    }
  });

  // Handle Submit QR
  document.getElementById('qrForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const file = qrInput.files[0];
    if (!file) {
      showAlert('Silakan pilih gambar QR Code terlebih dahulu.');
      return;
    }

    const formData = new FormData();
    formData.append('qrImage', file);

    const btnUpload = document.getElementById('btnUpload');
    const spinner = document.getElementById('btnUploadSpinner');
    const icon = document.getElementById('btnUploadIcon');
    const resultContainer = document.getElementById('resultContainer');
    const resultContent = document.getElementById('resultContent');

    btnUpload.disabled = true;
    spinner.classList.remove('d-none');
    icon.classList.add('d-none');
    resultContainer.classList.add('d-none');

    try {
      const res = await fetch('/api/presensi', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      resultContainer.classList.remove('d-none');

      if (data.status === 'hadir') {
        showAlert(data.message, 'success');
        let matkulHtml = '';
        if (data.results && data.results.length) {
          matkulHtml = '<ul>' + data.results.map(r => `<li><b>${r.matkul}</b>: ${r.status}</li>`).join('') + '</ul>';
        }
        resultContent.innerHTML = `<div class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i> ${data.message}</div>${matkulHtml}`;
      } else if (data.status === 'sudah_presensi') {
        showAlert(data.message, 'warning');
        resultContent.innerHTML = `<div class="text-warning fw-bold"><i class="bi bi-exclamation-triangle-fill me-1"></i> ${data.message}</div>`;
      } else if (data.status === 'tidak_eligible') {
        showAlert(data.message, 'info');
        resultContent.innerHTML = `<div class="text-info fw-bold"><i class="bi bi-info-circle-fill me-1"></i> ${data.message}</div>`;
      } else {
        showAlert(data.message || 'Presensi gagal', 'danger');
        resultContent.innerHTML = `<div class="text-danger fw-bold"><i class="bi bi-x-circle-fill me-1"></i> ${data.message}</div>`;
      }
    } catch (err) {
      showAlert('Terjadi kesalahan saat memproses gambar QR');
    } finally {
      btnUpload.disabled = false;
      spinner.classList.add('d-none');
      icon.classList.remove('d-none');
    }
  });
</script>

</body>
</html>
